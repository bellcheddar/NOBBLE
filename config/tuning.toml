derived_from = "config/hardware.toml"
note = "Generated by tools/hwprobe.py. Do not hand-edit: re-run the probe."

[compute]
cpu_workers = 14
io_workers = 16
model_device = "mps"
model_instances = 1
memory_headroom_gb = 24
usable_memory_gb = 104.0

[env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"
TOKENIZERS_PARALLELISM = "false"
OMP_NUM_THREADS = "14"
KMP_DUPLICATE_LIB_OK = "TRUE"

[campaign]
token_cap_tier1 = 400
token_cap_exceptions = ["VHL_VCB", "DCAF15_DDB1_DDA1"]
# Lifted from 96 on 2026-11-05: Marc's own machine, free compute, and 96 was
# an arbitrary spec figure. Changed in tools/hwprobe.py too, which writes this
# file, or the next probe would quietly put 96 back (D-NOB-073).
max_compute_hours = 240
wall_clock_budget_hours = 48
seeds = 5
# Seeds per arm for the Tier B arm. Its own key rather than borrowing
# design.minimum_seeds or scoring.collapse_minimum_seeds, both of which are
# 3 and mean something else: one number serving two meanings is F181, and a
# later change to either for its own reasons would silently change the depth
# of this arm. Equal to `seeds` today, because Marc lifted the compute
# ceiling and the arm runs at full depth (D-NOB-073).
tier_b_seeds = 5
# Longest one tier-1 job may run before it is killed. F20: the kill itself
# used to be the problem, not the limit.
job_timeout_seconds = 5400
tier1_recycles = 3
tier1_diffusion_samples = 1
tier1_potentials = false
tier2_recycles = 10
tier2_diffusion_samples = 25
tier2_potentials = true
# Largest token-times-sample product a tier-2 job has been observed to
# complete. Measured, not chosen: of 155 resolved tier-2 jobs every success
# is at most 454 tokens and every failure is 1,223, with no overlap, and the
# same 1,223-token jobs all complete at tier-1 settings (F298). 454 x 25 is
# therefore the largest product the evidence supports, and a job over it has
# its sample count reduced to fit rather than spending six hours to write
# nothing. Raise it when a larger product is seen to complete; that is the
# only thing that should raise it.
tier2_token_sample_budget = 11350
# How much longer a tier-2 job may run than a tier-1 one before it is
# abandoned. Was a bare `* 4` in runner.py, which put the number that
# decides when a refinement is killed in an expression rather than in
# config, and the existing cutoff sweep looks in comparisons, module
# constants and default arguments, not in arithmetic (F80).
#
# Unvalidated: tier 2 has never run. It does 10 recycles against 3 and 25
# diffusion samples against 1, so 4 is a guess rather than a measurement,
# and it is the quantity most likely to abandon a refinement that was
# working. The first tier-2 campaign measures it.
tier2_timeout_multiple = 4
#
# A floor, not the whole budget. tier2.py now sizes each refinement job from
# what tier 1 actually measured for that same pair: worst tier-1 wall clock
# times the scaling implied by the recycle and diffusion-sample ratios above,
# times this allowance. The allowance covers what the ratios do not, chiefly
# potentials, which steer the diffusion and are off at tier 1 and on at tier
# 2, so their cost appears in no ratio. 1.5 is a margin rather than a
# measurement and is the one number here that the first tier-2 run should
# replace (F100).
tier2_potentials_allowance = 1.5

[gates]
min_free_disk_gb = 50
