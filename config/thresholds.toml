# Every cutoff NOBBLE applies. Nothing in Python hard-codes a threshold.

[tier_b]
# Spec 3.3 selection function.
pocket_druggability_min = 0.85
mean_plddt_min = 80.0
# Spec 3.3's fourth Tier B filter. Left here for traceability and read by
# nothing: BINMAN's ligase.tumour_enriched is 0 for all 650 rows, so the
# filter is unpopulated rather than selective, and applying it literally
# emptied the funnel. See D-NOB-009.
tumour_enrichment_above_median = true  # not applied
take_top = 15
min_ligases_for_gate = 10

[peptide]
tile_length = 15
tile_step = 3
degron_flank = 20
scrambles_per_positive = 1
# Matched negatives drawn per degraded peptide for the Sievers arm. This sets
# the composition of the matched-control curve, so it is not a default to
# leave in a function signature.
negatives_per_positive = 4

[manifest]
token_cap_tier1 = 400
affinity_heavy_atom_cap = 128
# Shortest folded domain that may declare a token-cap exception (D-NOB-027).
# CR-8 is recognised through CDK12's kinase domain, and a kinase domain cut in
# half is not a kinase domain.
folded_domain_exception_min_length = 250

[geometry]
# Heavy-atom contact distance for the peptide-receptor contact map, angstrom.
contact_cutoff_a = 4.5
# A seed counts as docked when the peptide reaches within this of the receptor.
docked_contact_cutoff_a = 5.0
# Degron Scan's contact distance against the deposited structure, angstrom.
degron_scan_contact_cutoff_a = 5.0
# Pocket constraint radius when conditioning a ligand, angstrom.
pocket_max_distance_a = 6.0
# Distance within which a receptor residue counts as lining the ligand pocket
# when the constraint's contact list is built. Distinct from the radius above:
# that is how far the ligand may sit from the listed residues, this is which
# residues get listed.
pocket_contact_cutoff_a = 5.0
# Smallest heteroatom residue that may be treated as a glue or degrader rather
# than a buffer salt, in heavy atoms.
ligand_min_heavy_atoms = 12

[lysine]
# Relative SASA above which a lysine counts as solvent exposed.
exposed_rel_sasa = 0.25

[numbering]
# Fraction of residues allowed to disagree before a numbering frame is rejected.
max_mismatch_fraction = 0.1
# How far the anchor may slide looking for canonical sequence before giving up.
# 6H0F's IKZF1 chain starts GGR where Q13422 has SHT, so anchoring only at the
# N-terminus fails on an ordinary structure.
max_anchor_slide = 40

[substrate]
# Domain coverage above which a degron window is treated as self-sufficient.
domain_coverage_self_sufficient = 0.80

[scoring]
# A seed is collapsed when it sits this far below the median of its set.
collapse_margin = 0.30
# Fewest seeds carrying a value before collapse detection is attempted at all.
collapse_minimum_seeds = 3
# How far the IKZF1 control may move before a campaign comparison is untrusted.
control_tolerance_a = 2.0
# Change in median RMSD that counts as a real improvement or regression when
# one campaign is compared against another. This is the cutoff behind the
# words "F6 supported", so it belongs here rather than in compare.py.
campaign_change_margin_a = 2.0
# Receptor anchor RMSD above which the superposition frame is called poor and
# every peptide RMSD measured in it is flagged as unreliable.
frame_poor_anchor_rmsd_a = 5.0
# Pose recovery success-rate curve breakpoints, in angstrom.
rmsd_breakpoints = [1.0, 2.0, 3.0, 5.0]
# Below this p-value a reported correlation is shown as holding rather than
# as provisional. The only significance level this project applies, and it
# applies it to presentation rather than to any decision about the data.
significance_alpha = 0.05
seeds = 5

[gates]
min_free_disk_gb = 50

[watchdog]
# A running job is "overdue" past this multiple of the slowest comparable job
# the same campaign has already completed, scaled by token count.
# Informational only: Boltz timings vary and a slow job is not a stalled one.
overdue_multiple = 3.0
# Margin on the hard stall bound. The bound itself is derived from the
# runner's own timeout, retry count and kill grace rather than set here, so
# it cannot drift away from the behaviour it describes.
stall_margin_minutes = 10

[conditioning]
# Disagreement between the conditioned and unconstrained arms above which the
# conditioned pose is treated as forced by the pocket constraint rather than
# found. Published per pair as `forced`.
forced_disagreement = 0.2

[design]
# Fewest seeds a variant or its parent may be scored over before a lift is
# refused outright. Was MINIMUM_SEEDS in nobble/design/lift.py.
minimum_seeds = 3
# Fraction of the parent's bridging rate a variant must retain before its
# bridge is called weakened. Outright loss was already flagged; a parent at
# 10/10 against a variant at 1/10 was not, and reads as a clean improvement
# when the lift happens to be positive.
bridge_rate_retained_min = 0.5

[plddt]
# Width of the contiguous window whose mean pLDDT stands in for the model's.
# A whole-model mean punishes a protein with one tight domain and long
# disordered linkers, which is exactly the shape Tier B is looking for.
domain_window = 200

[tier2]
# Fewest ranked pairs before a tier-2 refinement is attempted at all.
minimum_ranked = 3
# Fraction of ranked pairs refined at tier 2. Twenty-five diffusion samples
# per job, so this decides how much of the campaign's compute the refinement
# costs: not a default to leave in a signature.
decile_fraction = 0.1

[weights]
# Fewest labelled pairs before any weight fit is attempted.
minimum_labelled = 8
# Below this many labelled pairs the weights are reported as indicative only.
indicative_below_labelled = 25
# Below this many on either side of the split, the AUC's bounds are called
# very wide and the number is not a performance claim.
wide_bounds_below_per_side = 5

[validation]
# Fewest pairs on each side before the matched-control curve is drawn at all.
# Spec 5: reporting a curve without the matched negatives is itself the
# failure, so refusing here is correct behaviour rather than a gap.
roc_minimum_per_side = 3
