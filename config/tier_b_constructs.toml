# Tier B receptor constructs (spec 3.3, F163).
#
# Spec 1.1 names a receptor construct for each Tier A ligase, because which
# domain of a ligase binds its substrate is science knowledge and not a
# lookup. Spec 3.3 selects fifteen Tier B ligases and names no construct for
# any of them, so Tier B is selected, frozen, gate-passed and unrunnable.
#
# This file is the gap, as a form. One entry per ligase and Tier B can be
# assembled; the loader in nobble/curate/tier_b_constructs.py refuses and
# names what is missing until then. Nothing here is derivable: the two
# mechanical routes are both ruled out, the longest annotated domain by F41
# and the frozen best_window because it says which part of the model is
# confident rather than which part binds substrate.
#
# The candidates below are InterPro entries on each accession between 60
# residues and 326, which is the tier-1 token cap of 400 less a 15-mer
# peptide and a glue at the recall set's median of 59 heavy atoms. Member
# database duplicates of the same region are collapsed. A domain outside that
# range is still allowed: set exception = true and say why, as spec 1.1 does
# for VHL and DCAF15.
#
# Entries are read as:
#
#   [constructs.DCAF8L1_EXAMPLE]
#   e3_gene = "DCAF8L1"
#   rationale = "why this domain is the substrate-binding one"
#   exception = false
#   [[constructs.DCAF8L1_EXAMPLE.segments]]
#   accession = "A6NGE4"
#   label = "DDB1- and CUL4-associated factor"
#   interpro_entry = "IPR045151"
#   occurrence = 0          # omit unless the entry is annotated twice
#   note = ""

